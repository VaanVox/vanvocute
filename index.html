<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Troll</title>

<style>
html,body{
margin:0;
height:100%;
display:flex;
justify-content:center;
align-items:center;
background:black;
overflow:hidden;
}

#middleFinger{
font-size:30vw;
opacity:0;
transform:scale(.1);
transition:all .4s;
}

.show{
opacity:1;
transform:scale(3);
}
</style>

</head>

<body>

<div id="middleFinger">🖕</div>

<script>
setTimeout(function(){
document.getElementById("middleFinger").classList.add("show");
},1000);
</script>

</body>
</html>
